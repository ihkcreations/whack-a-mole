<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whack A Mole</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Whack A Mole</h1>
      <div class="scoreboard">
        <div class="score-box">
          <span class="label">Score</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="score-box">
          <span class="label">Time</span>
          <span id="timer" class="value">30</span>
        </div>
      </div>
    </header>
    <section class="controls">
      <button id="start-btn" class="btn">Start Game</button>
      <button id="reset-btn" class="btn secondary" disabled>Reset</button>
    </section>
    <div id="board" class="board">
      <div class="hole" data-index="0">
        <div class="mole"></div>
      </div>
      <div class="hole" data-index="1">
        <div class="mole"></div>
      </div>
      <div class="hole" data-index="2">
        <div class="mole"></div>
      </div>
      <div class="hole" data-index="3">
        <div class="mole"></div>
      </div>
      <div class="hole" data-index="4">
        <div class="mole"></div>
      </div>
      <div class="hole" data-index="5">
        <div class="mole"></div>
      </div>
      <div class="hole" data-index="6">
        <div class="mole"></div>
      </div>
      <div class="hole" data-index="7">
        <div class="mole"></div>
      </div>
      <div class="hole" data-index="8">
        <div class="mole"></div>
      </div>
    </div>
    <div id="message" class="message">Press Start Game to begin playing</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
